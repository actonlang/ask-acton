<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acton Playground</title>
    <link rel="stylesheet" href="/playground.css">
  </head>
  <body>
    <main class="playground">
      <section class="playground__editor">
        <header>
          <div>
            <p>Acton Playground</p>
            <small>Runs are limited to 15 seconds.</small>
          </div>
          <button id="run" type="button">Run</button>
        </header>
        <div class="editor-frame">
          <pre id="line-numbers" aria-hidden="true">1</pre>
          <textarea id="code" spellcheck="false" wrap="off">actor main(env):
    print("Hello from Acton")
    env.exit(0)
</textarea>
        </div>
      </section>

      <section class="playground__output" aria-live="polite">
        <header>
          <p>Output</p>
          <span id="status">Ready</span>
        </header>
        <div class="progress" aria-hidden="true">
          <span id="progress-bar"></span>
        </div>
        <pre id="output"></pre>
      </section>
    </main>

    <script src="/playground.js"></script>
  </body>
</html>
