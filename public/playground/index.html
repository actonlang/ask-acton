<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acton Playground</title>
    <link rel="stylesheet" href="/playground.css">
  </head>
  <body>
    <main class="playground">
      <section class="playground__editor">
        <header>
          <p>Acton Playground</p>
          <button id="run" type="button">Run</button>
        </header>
        <textarea id="code" spellcheck="false">actor main(env):
    print("Hello from Acton")
    env.exit(0)
</textarea>
      </section>

      <section class="playground__output" aria-live="polite">
        <header>
          <p>Output</p>
          <span id="status">Ready</span>
        </header>
        <div class="progress" aria-hidden="true">
          <span id="progress-bar"></span>
        </div>
        <div class="output-streams">
          <section class="output-stream">
            <h2>Compiler</h2>
            <pre id="compiler-output"></pre>
          </section>
          <section class="output-stream">
            <h2>Program</h2>
            <pre id="program-output"></pre>
          </section>
        </div>
      </section>
    </main>

    <script src="/playground.js"></script>
  </body>
</html>
