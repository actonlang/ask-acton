services:
  ask-acton:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    expose:
      - "8787"

  playground:
    build:
      context: .
      dockerfile: Dockerfile.playground
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    expose:
      - "8788"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/ask-acton/playground:/var/lib/ask-acton/playground
      - /var/lib/ask-acton/cache:/var/lib/ask-acton/cache

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - ask-acton
      - playground
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
